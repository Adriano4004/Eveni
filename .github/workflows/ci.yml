name: Verificação

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eveni
          POSTGRES_PASSWORD: eveni
          POSTGRES_DB: eveni_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eveni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://eveni:eveni@localhost:5432/eveni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes (unitários e integração)
        run: npm test
      - name: Dependências sem vulnerabilidades graves
        run: npm audit --omit=dev --audit-level=high
      - name: Testes no browser
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
